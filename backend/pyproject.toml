[project]
name = "daas-studio"
version = "0.1.0"
description = "AI-powered Data-as-a-Service studio: prompt -> calibrated scraper -> enriched dataset -> sellable data product"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "zstandard>=0.23",
    "duckdb>=1.1",
    "rapidfuzz>=3.9",
    "openpyxl>=3.1",
    "typer>=0.12",
    "python-multipart>=0.0.9",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
daas = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]
ignore = ["E501", "B008", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
